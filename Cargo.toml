[package]
name = "tokio_basics"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.11"
log = "0.4.34"
tokio = { version = "1.48.0", features = ["full"] }
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.20.0"
headless_chrome = "1.0" 